name: Bug report
description: 报告可复现的缺陷
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除视频内容、API Key、本机绝对路径和其他隐私信息。
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python、GPU、LLM/ASR/TTS provider、模型名称和 FFmpeg 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
