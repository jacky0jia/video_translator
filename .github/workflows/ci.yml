name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install FFmpeg with subtitle support
        run: |
          choco install ffmpeg --no-progress --yes
          ffmpeg -version
          $filters = ffmpeg -hide_banner -filters 2>&1
          if (-not ($filters | Select-String -Pattern 'subtitles')) {
            throw "Installed FFmpeg does not provide the subtitles/libass filter"
          }

      - name: Run release acceptance checks
        run: python packaging/release_check.py --production-audit
